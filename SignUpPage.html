<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>uniConnect LOGIN Page</title>
    <link rel="stylesheet" href="cssLoginPage.css">
    <script src="JS-countUsers.js"></script>
</head>
<body>
    <section>
        <div class="left-side">
        <h3><span class="ICON"><ion-icon name="school-outline"></ion-icon></span>uniConnect</h3>
        </div>
    <div class="login-box">
        
        <form action="" onsubmit="handleSignUp(event)">
            <h2>Sign Up</h2>
            <div class="input-box">
                <span class="icon"><ion-icon name="person"></ion-icon></span>
                <input type="text" name="username" required>
                <label>Username</label>
            </div>
            <div class="input-box">
                <span class="icon"><ion-icon name="mail"></ion-icon></span>
                <input type="email" name="email" required>
                <label>Email</label>
            </div>
            <div class="input-box">
                <span class="icon"><ion-icon name="lock-closed"></ion-icon></span>
                <input type="password" name="password" required>
                <label>Password</label>
            </div>
            
            <div class="remember-forget">
                <label><input type="checkbox" required>Agree to the terms of service</label>
            </div>
            <button type="submit">Sign Up</button>
            <div class="register-link">
                <p>Already have an acount account? <a href="#" onclick="location.href='LoginPage.html'">login</a></p>
            </div>
        </form>
        
    </div>
</section>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
